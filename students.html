<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="topbar">
<h2>Students</h2>
</header>

</div>

<script src="js/students.js"></script>

</html>
