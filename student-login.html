<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SB English Tuition | Student Login</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="css/student-login.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo-box">
            <i class="fas fa-graduation-cap"></i>
            <h1>SB English Tuition</h1>
            <p>Student Login Portal</p>
        </div>

        <form id="studentLoginForm">

            <div class="input-group">

                <label>Student ID</label>

                <div class="input-box">

                    <i class="fas fa-user"></i>

                    <input
                    type="text"
                    id="studentId"
                    placeholder="SBET001"
                    required>

                </div>

            </div>


            <div class="input-group">

                <label>Password</label>

                <div class="input-box">

                    <i class="fas fa-lock"></i>

                    <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required>

                    <span id="togglePassword">

                        <i class="fas fa-eye"></i>

                    </span>

                </div>

            </div>


            <button
            type="submit"
            class="login-btn">

                Login

            </button>

        </form>

        <div class="login-footer">

            <p><b>Student ID:</b> SBET001</p>

            <p>Password can be changed after first login.</p>

        </div>

    </div>

</div>

<script src="js/student-login.js"></script>

</body>
</html>
