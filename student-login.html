<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Student Login | SB English Tuition</title>

<link rel="stylesheet" href="css/student-login.css">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">

            🎓

        </div>

        <h1>SB English Tuition</h1>

        <p class="subtitle">

            Student Login

        </p>

        <input
        type="text"
        id="studentId"
        placeholder="Student ID">

        <div class="password-box">

            <input
            type="password"
            id="password"
            placeholder="Password">

            <button
            type="button"
            id="togglePassword">

            👁

            </button>

        </div>

        <button
        id="loginBtn">

        Login

        </button>

        <button
        id="forgotBtn"
        class="link-btn">

        Forgot Password?

        </button>

        <p id="loginMsg"></p>

    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore-compat.js"></script>

<script src="js/student-login.js"></script>

</body>

</html>
