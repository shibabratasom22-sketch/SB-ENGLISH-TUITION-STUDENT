<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SB English Tuition - Digital Library</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/books.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="library-page">

<div class="library-header">

<h1>📚 Digital Library</h1>

<p>Books • Notes • PDFs • Images</p>

</div>

<div class="search-box">

<input
type="text"
id="searchBook"
placeholder="Search books..."
onkeyup="searchBooks()">

</div>

<div class="category-grid">

<div class="category-card" data-class="VI">
<h2>VI</h2>
<p>Class Six</p>
</div>

<div class="category-card" data-class="VII">
<h2>VII</h2>
<p>Class Seven</p>
</div>

<div class="category-card" data-class="VIII">
<h2>VIII</h2>
<p>Class Eight</p>
</div>

<div class="category-card" data-class="IX">
<h2>IX</h2>
<p>Class Nine</p>
</div>

<div class="category-card" data-class="X">
<h2>X</h2>
<p>Class Ten</p>
</div>

<div class="category-card" data-class="XI">
<h2>Class XI</h2>
<p>Higher Secondary</p>
</div>

<div class="category-card" data-class="XII">
<h2>Class XII</h2>
<p>Higher Secondary</p>
</div>

</div>

<div id="booksContainer">

</div>

        <!-- Floating Upload Button -->

    <div id="uploadButton" class="floating-upload">

        <i class="fa-solid fa-plus"></i>

    </div>

    <!-- Upload Modal -->

    <div id="uploadModal" class="upload-modal">

        <div class="upload-box">

            <h2>📚 Add New Book</h2>

            <label>Book Title</label>

            <input
                type="text"
                id="bookTitle"
                placeholder="Enter Book Title">

            <label>Class</label>

            <select id="bookClass">

                <option value="">Select Class</option>

                <option value="VI">VI</option>
                <option value="VII">VII</option>
                <option value="VIII">VIII</option>
                <option value="IX">IX</option>
                <option value="X">X</option>
                <option value="XI">XI</option>
                <option value="XII">XII</option>

            </select>

            <label>File Type</label>

            <select id="bookType">

                <option value="pdf">📄 PDF</option>
                <option value="image">🖼 Image</option>

            </select>

            <label>GitHub File URL</label>

            <input
                type="url"
                id="bookUrl"
                placeholder="https://...">

            <div class="upload-actions">

                <button
                    id="uploadBookBtn"
                    class="upload-btn">

                    <i class="fa-solid fa-floppy-disk"></i>
                    Save Book

                </button>

                <button
                    id="closeUploadBtn"
                    class="close-btn"
                    type="button">

                    <i class="fa-solid fa-xmark"></i>
                    Close

                </button>

            </div>

        </div>

    </div>

        <!-- Firebase -->

    <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore-compat.js"></script>

    <!-- Books Module -->

    <script src="js/books.js"></script>

</div>

</body>

</html>
