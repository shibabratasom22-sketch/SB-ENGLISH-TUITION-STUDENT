<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Student Dashboard</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="dashboard">

<h1>📘 SB English Tuition</h1>

<h2 id="welcomeName">Welcome</h2>

<p id="studentInfo"></p>

<div class="menu">

<div class="card">
📚
<h3>Books</h3>
</div>

<div class="card">
📝
<h3>Homework</h3>
</div>

<div class="card">
📢
<h3>Notice</h3>
</div>

<div class="card">
💰
<h3>Fees</h3>
</div>

<div class="card">
📊
<h3>Results</h3>
</div>

<div class="card">
👤

<button id="logoutBtn">Logout</button>

</div>

<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDIOg_0tsEnh5oItSXA8j6EgrkWBdi07Nk",
  authDomain: "sb-english-tuition.firebaseapp.com",
  projectId: "sb-english-tuition",
  storageBucket: "sb-english-tuition.firebasestorage.app",
  messagingSenderId: "162778343838",
  appId: "1:162778343838:web:f21008cab298e19fa48e8f"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

auth.onAuthStateChanged((user)=>{
const db = firebase.firestore();
    if(user){

        const email = user.email;

        if(email === "admin@sbenglishtuition.app"){

            document.getElementById("welcomeName").innerHTML="Welcome Admin";
            document.getElementById("studentInfo").innerHTML=email;

        }else{

            const studentId=email.split("@")[0].toUpperCase();

            document.getElementById("welcomeName").innerHTML="Welcome Student";

            document.getElementById("studentInfo").innerHTML="Student ID : "+studentId;

        }

    }else{

        window.location.href="index.html";

    }

});

document.getElementById("logoutBtn").onclick=()=>{

    auth.signOut().then(()=>{

        window.location.href="index.html";

    });

};

</script>

</body>
</html>
